name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_crates:
        description: 'Publish crates to crates.io'
        required: true
        type: boolean
        default: true
      publish_maven:
        description: 'Publish JVM package to Maven Central'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build-release-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: aerolog
            archive_suffix: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: aerolog
            archive_suffix: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: aerolog
            archive_suffix: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: aerolog
            archive_suffix: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: aerolog.exe
            archive_suffix: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build aerolog-cli binary and uniffi dynamic library
        run: |
          cargo build --release -p aerolog-cli --target ${{ matrix.target }}
          cargo build --release -p aerolog-uniffi --target ${{ matrix.target }}

      - name: Package Unix Archive
        if: matrix.os != 'windows-latest'
        run: |
          RELEASE_DIR="aerolog-${{ matrix.target }}"
          mkdir -p "$RELEASE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$RELEASE_DIR/"
          cp README.md LICENSE "$RELEASE_DIR/"
          tar -czvf "aerolog-${{ matrix.target }}.tar.gz" "$RELEASE_DIR"

          CDYLIB_DIR="cdylib-${{ matrix.target }}"
          mkdir -p "$CDYLIB_DIR"
          if [[ "${{ matrix.target }}" == *"apple"* ]]; then
            cp "target/${{ matrix.target }}/release/libaerolog_uniffi.dylib" "$CDYLIB_DIR/libaerolog_uniffi_${{ matrix.target }}.dylib"
          else
            cp "target/${{ matrix.target }}/release/libaerolog_uniffi.so" "$CDYLIB_DIR/libaerolog_uniffi_${{ matrix.target }}.so"
          fi
        shell: bash

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        run: |
          $RELEASE_DIR = "aerolog-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $RELEASE_DIR
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination $RELEASE_DIR
          Copy-Item README.md, LICENSE -Destination $RELEASE_DIR
          Compress-Archive -Path $RELEASE_DIR -DestinationPath "aerolog-${{ matrix.target }}.zip"

          $CDYLIB_DIR = "cdylib-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $CDYLIB_DIR
          Copy-Item "target/${{ matrix.target }}/release/aerolog_uniffi.dll" -Destination "$CDYLIB_DIR/aerolog_uniffi_${{ matrix.target }}.dll"
        shell: pwsh

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: aerolog-${{ matrix.target }}.${{ matrix.archive_suffix }}

      - name: Upload CDYLIB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cdylib-${{ matrix.target }}
          path: cdylib-${{ matrix.target }}/*

  create-github-release:
    name: Create GitHub Release & Publish Maven Central
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-artifacts

      - name: Download all cdylib artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cdylib-*
          merge-multiple: true
          path: cdylib-artifacts

      - name: Package Multiplatform JVM JAR
        run: |
          chmod +x gradlew scripts/package-jvm-jar.sh
          scripts/package-jvm-jar.sh --artifacts-dir cdylib-artifacts --jar
          cp target/aerolog-jvm-*.jar release-artifacts/
        shell: bash

      - name: Build, Sign, and Stage Maven Artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ""
        run: |
          ./gradlew :bindings:kotlin-jvm:publishAllPublicationsToStagingRepository --no-daemon

      - name: Publish to GitHub Packages
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ""
        run: |
          ./gradlew :bindings:kotlin-jvm:publishAllPublicationsToGitHubPackagesRepository --no-daemon || echo "Warning: GitHub Packages publishing skipped."

      - name: Package Central Bundle
        run: |
          mkdir -p build/staging-repo
          cd build/staging-repo
          zip -r ../bundle.zip io/ -x "*/maven-metadata*"
          ls -la ../bundle.zip
          cp ../bundle.zip ../../release-artifacts/aerolog-maven-bundle.zip

      - name: Upload to Sonatype Central Portal
        if: (github.event_name == 'push' || inputs.publish_maven == true) && env.SONATYPE_USERNAME != '' && env.SONATYPE_PASSWORD != ''
        env:
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="0.1.0"
          fi

          AUTH_HEADER="Bearer $(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w 0)"

          echo "Uploading bundle for version $VERSION to Sonatype Central Portal..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=aerolog-${VERSION}" \
            -H "Authorization: $AUTH_HEADER" \
            -F "bundle=@build/bundle.zip;type=application/octet-stream")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error: Failed to upload to Sonatype Central Portal"
            exit 1
          fi
          echo "Deployment initiated successfully on Sonatype Central Portal. Deployment ID: $BODY"

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve Release Notes
        id: release_notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -f "RELEASE_NOTES_${TAG_NAME}.md" ]; then
            echo "notes_file=RELEASE_NOTES_${TAG_NAME}.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }}: AeroLog Universal Local-First Storage Engine"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          files: |
            release-artifacts/*
          generate_release_notes: ${{ steps.release_notes.outputs.notes_file == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to Crates.io
    needs: create-github-release
    if: github.event_name == 'push' || inputs.publish_crates == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set. Skipping crates.io publishing."
            exit 0
          fi

          echo "Publishing aerolog-cbor..."
          cargo publish -p aerolog-cbor || echo "aerolog-cbor already published or publish skipped."

          echo "Waiting 20 seconds for crates.io index propagation..."
          sleep 20

          echo "Publishing aerolog-core..."
          cargo publish -p aerolog-core || echo "aerolog-core already published or publish skipped."

          echo "Waiting 20 seconds for crates.io index propagation..."
          sleep 20

          echo "Publishing aerolog-uniffi..."
          cargo publish -p aerolog-uniffi || echo "aerolog-uniffi already published or publish skipped."

          echo "Waiting 20 seconds for crates.io index propagation..."
          sleep 20

          echo "Publishing aerolog-cli..."
          cargo publish -p aerolog-cli || echo "aerolog-cli already published or publish skipped."

          echo "All AeroLog crates published successfully."
