# Dependabot configuration for AeroLog
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Cargo Ecosystem (Root Cargo.toml, workspace crates, and Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  # 2. GitHub Actions Workflows (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
