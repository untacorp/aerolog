name: Bug Report
description: Create a report to help us improve AeroLog
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please provide detailed reproduction steps.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code example or sequence of operations.
      placeholder: |
        1. Initialize AeroLogDb with default options...
        2. Append 10,000 entries...
        3. Trigger compact...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust compiler version, and AeroLog crate version.
      value: |
        - OS: [e.g. Linux x86_64, macOS Apple Silicon, Windows 11, Android, iOS]
        - Rust Version: [e.g. 1.84.0]
        - AeroLog Crate & Version: [e.g. aerolog-core 0.1.0]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Trace
      description: Please copy and paste any crash trace or RUST_LOG output here.
      render: shell
